<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Voice</title>
  <meta name="description" content="Project Voice — The fitness tracker for your voice.">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fbfaf8;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }
    .page {
      position: relative;
      width: min(100vw, calc(100vh * 1.50000000));
      width: min(100vw, calc(100svh * 1.50000000));
      aspect-ratio: 1536 / 1024;
    }
    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .email-link {
      position: absolute;
      /* Invisible clickable area over the email address in the artwork */
      left: 37%;
      top: 76%;
      width: 27%;
      height: 6%;
      display: block;
      text-decoration: none;
      background: transparent;
    }
    .email-link:focus-visible {
      outline: 2px solid #4d8f7f;
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Project Voice">
    <img
      src="project-voice-holding-page.jpeg"
      alt="Project Voice. The fitness tracker for your voice. Richard Steven. contact@project-voice.com"
    >
    <a
      class="email-link"
      href="mailto:contact@project-voice.com"
      aria-label="Email Project Voice at contact@project-voice.com"
      title="Email contact@project-voice.com"
    ></a>
  </main>
</body>
</html>
